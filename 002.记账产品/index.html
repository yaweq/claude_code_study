<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FFF7F9">
  <title>每日记账</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1 class="app-title">每日记账</h1>
    </header>

    <main id="views">
      <section id="view-home" class="view active"></section>
      <section id="view-bills" class="view"></section>
      <section id="view-stats" class="view"></section>
      <section id="view-mine" class="view"></section>
    </main>

    <nav class="tabbar">
      <button class="tab" data-tab="home"><span class="tab-icon">🏠</span><span class="tab-label">首页</span></button>
      <button class="tab" data-tab="bills"><span class="tab-icon">📋</span><span class="tab-label">账单</span></button>
      <button class="tab tab-record" data-tab="record"><span class="record-fab">＋</span></button>
      <button class="tab" data-tab="stats"><span class="tab-icon">📊</span><span class="tab-label">统计</span></button>
      <button class="tab" data-tab="mine"><span class="tab-icon">👤</span><span class="tab-label">我的</span></button>
    </nav>
  </div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/views.js"></script>
  <script src="js/record.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
