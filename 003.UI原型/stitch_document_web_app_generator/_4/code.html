<script>
  let currentAmount = "28.00";
  let isFreshAmount = true;
  let currentCategory = "餐饮";
  let currentType = "expense";

  function updateDisplay() {
    const el = document.getElementById("display-amount");
    el.innerText = currentAmount || "0.00";
  }

  function pressKey(char) {
    if (isFreshAmount) {
      currentAmount = char === "." ? "0." : char;
      isFreshAmount = false;
    } else {
      if (char === "." && currentAmount.includes(".")) return;
      const parts = currentAmount.split(".");
      if (parts.length > 1 && parts[1].length >= 2) return;
      if (currentAmount.length > 8) return;
      currentAmount += char;
    }
    updateDisplay();
  }

  function pressBackspace() {
    if (isFreshAmount || currentAmount.length <= 1) {
      currentAmount = "0";
      isFreshAmount = true;
    } else {
      currentAmount = currentAmount.slice(0, -1);
    }
    updateDisplay();
  }

  function pressOperator(op) {
    showToast(`计算模式已暂存 (${op})`);
  }

  function pressSpecial(type) {
    if (type === 'today') {
      showToast("已重置记账日期为今日");
    }
  }

  function switchType(type) {
    currentType = type;
    const tabExp = document.getElementById("tab-expense");
    const tabInc = document.getElementById("tab-income");
    const btnSubmit = document.getElementById("btn-submit");

    if (type === 'expense') {
      tabExp.className = "px-space-md py-1.5 rounded-full font-label-md text-label-md transition-all duration-200 bg-primary text-on-primary shadow-sm flex items-center gap-1";
      tabInc.className = "px-space-md py-1.5 rounded-full font-label-md text-label-md transition-all duration-200 text-on-surface-variant hover:text-on-surface flex items-center gap-1";
      btnSubmit.className = "h-13 py-3 rounded-lg bg-primary text-on-primary font-headline-sm text-headline-sm shadow-[0_4px_16px_rgba(165,52,97,0.35)] active:scale-95 transition-all flex items-center justify-center";
    } else {
      tabInc.className = "px-space-md py-1.5 rounded-full font-label-md text-label-md transition-all duration-200 bg-secondary text-on-secondary shadow-sm flex items-center gap-1";
      tabExp.className = "px-space-md py-1.5 rounded-full font-label-md text-label-md transition-all duration-200 text-on-surface-variant hover:text-on-surface flex items-center gap-1";
      btnSubmit.className = "h-13 py-3 rounded-lg bg-secondary text-on-secondary font-headline-sm text-headline-sm shadow-[0_4px_16px_rgba(13,107,84,0.35)] active:scale-95 transition-all flex items-center justify-center";
    }
  }

  function selectCategory(el, name, emoji) {
    currentCategory = name;
    document.querySelectorAll('.cat-pill').forEach(btn => {
      btn.className = "cat-pill relative flex flex-col items-center justify-center p-2 rounded-lg bg-surface-container text-on-surface-variant transition-all duration-200 active:scale-95 hover:bg-surface-container-high";
      const badge = btn.querySelector('.absolute');
      if (badge) badge.remove();
    });

    const isExpense = currentType === 'expense';
    el.className = isExpense
      ? "cat-pill relative flex flex-col items-center justify-center p-2 rounded-lg bg-primary-fixed text-on-primary-fixed shadow-sm transition-all duration-200 active:scale-95"
      : "cat-pill relative flex flex-col items-center justify-center p-2 rounded-lg bg-secondary-fixed text-on-secondary-fixed transition-all duration-200 active:scale-95";

    const badge = document.createElement("div");
    badge.className = `absolute -top-1 -right-1 w-4 h-4 ${isExpense ? 'bg-primary text-on-primary' : 'bg-secondary text-on-secondary'} rounded-full flex items-center justify-center shadow-xs`;
    badge.innerHTML = `<span class="material-symbols-outlined text-[11px]" style="font-variation-settings: 'FILL' 1;">check</span>`;
    el.appendChild(badge);
  }

  function editNote() {
    const res = prompt("输入备注信息：", "买杯生椰拿铁");
    if (res !== null && res.trim() !== "") {
      document.getElementById("note-label").innerText = res.trim();
    }
  }

  function showToast(msg) {
    const toast = document.getElementById("toast-pill");
    const text = document.getElementById("toast-text");
    text.innerText = msg;
    toast.classList.remove("opacity-0", "-translate-y-2");
    toast.classList.add("opacity-100", "translate-y-0");

    setTimeout(() => {
      toast.classList.remove("opacity-100", "translate-y-0");
      toast.classList.add("opacity-0", "-translate-y-2");
    }, 1800);
  }

  function submitEntry() {
    const typeLabel = currentType === 'expense' ? '支出' : '收入';
    const amountVal = parseFloat(currentAmount || "0").toFixed(2);
    showToast(`已极速记录 ${typeLabel} ¥${amountVal} ${currentCategory}`);

    const isContinuous = document.getElementById("continuous-check").checked;
    if (isContinuous) {
      currentAmount = "0.00";
      isFreshAmount = true;
      updateDisplay();
    } else {
      setTimeout(() => {
        history.back();
      }, 700);
    }
  }
</script></main></body></html>
