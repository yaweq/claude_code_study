<!-- 2. Main Login Card Container -->

<!-- Pill Tab Switcher -->

<!-- 3. Form Input Section -->
<form class="flex flex-col gap-space-md" onsubmit="event.preventDefault();">

<div class="flex items-center gap-1 pr-space-sm mr-space-sm border-r-0 text-on-surface">
<span class="font-label-md text-label-md font-semibold text-primary">+86</span>
<span class="material-symbols-outlined text-outline text-[16px]">expand_more</span>
</div>
<input class="flex-1 bg-transparent border-0 outline-none font-body-lg text-body-lg text-on-surface placeholder:text-outline-variant font-medium min-w-0" id="phoneInput" maxlength="11" placeholder="请输入手机号码" type="tel" value="138 0013 8000">
<button class="text-outline hover:text-on-surface p-1 rounded-full flex items-center justify-center" onclick="document.getElementById('phoneInput').value='';" type="button">
<span class="material-symbols-outlined text-[18px]">cancel</span>
</button>
</div>
</div>
<!-- Verification Code / Password Input -->
<div class="flex flex-col gap-space-xs">
<div class="flex items-center justify-between pl-2 pr-1">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="codeInput" id="codeLabel">短信验证码</label>
<button class="font-label-sm text-label-sm text-primary hover:underline" type="button">遇到问题？找回账号</button>
</div>
<div class="flex items-center bg-surface-container-low rounded-DEFAULT px-space-md py-2.5 focus-within:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-on-surface-variant mr-space-sm text-[20px]">shield_lock</span>
<input class="flex-1 bg-transparent border-0 outline-none font-body-lg text-body-lg text-on-surface placeholder:text-outline-variant font-medium tracking-wider min-w-0" id="codeInput" maxlength="6" placeholder="6位数字验证码" type="text">
<!-- Dynamic action: Get Code Button (default) or Password Visibility -->
<div class="flex items-center shrink-0" id="dynamicInputTrailing">
<button class="px-3 py-1.5 rounded-full bg-primary-container text-on-primary-container font-label-sm text-label-sm hover:opacity-90 active:scale-95 transition-all shadow-sm" id="sendCodeBtn" onclick="startCountdown()" type="button">
              获取验证码
            </button>
</div>
</div>
</div>
<!-- 4. Primary CTA -->
<div class="pt-space-xs">
<button class="w-full h-12 rounded-full bg-gradient-to-r from-primary to-primary-container text-on-primary font-headline-sm text-headline-sm flex items-center justify-center gap-space-sm shadow-[0_8px_20px_rgba(255,123,169,0.35)] active:scale-[0.98] transition-transform" onclick="triggerLogin()" type="button">
<span class="">一键登录 / 注册</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
<!-- FaceID / Biometric Access Pill -->
<div class="flex items-center justify-center pt-space-xs">
<button class="inline-flex items-center gap-space-xs px-3 py-1.5 rounded-full bg-secondary-fixed/40 hover:bg-secondary-fixed/70 transition-colors" type="button">
<span class="material-symbols-outlined text-secondary text-[16px]" style="font-variation-settings: 'FILL' 1;">face</span>
<span class="font-label-sm text-label-sm text-on-secondary-fixed-variant">支持 Face ID 极速免密登录</span>
</button>
</div><div class="flex items-center justify-center pt-space-xs text-body-md"><span class="text-on-surface-variant font-label-md">还没有账号？</span><button type="button" class="font-label-md text-primary font-semibold hover:underline inline-flex items-center gap-0.5 ml-1">立即注册<span class="material-symbols-outlined text-[16px]">chevron_right</span></button></div>
</form>
</div>
<!-- 5. Alternative Social Logins -->
<section class="mt-space-lg flex flex-col items-center w-full relative z-10">
<div class="flex items-center w-full mb-space-md">
<div class="flex-1 h-[1px] bg-surface-variant"></div>
<span class="px-space-md font-label-sm text-label-sm text-on-surface-variant">或通过以下方式快速登录</span>
<div class="flex-1 h-[1px] bg-surface-variant"></div>
</div>
<div class="flex items-center justify-center gap-space-lg">
<!-- WeChat -->
<button aria-label="微信登录" class="flex flex-col items-center gap-1 group" type="button">
<div class="w-12 h-12 rounded-full bg-surface-container-lowest shadow-sm flex items-center justify-center group-hover:bg-secondary-container/40 active:scale-95 transition-all">
<span class="material-symbols-outlined text-secondary text-[24px]">chat_bubble</span>
</div>

</button>
<!-- Apple ID -->
<button aria-label="Apple 账号登录" class="flex flex-col items-center gap-1 group" type="button">
<div class="w-12 h-12 rounded-full bg-surface-container-lowest shadow-sm flex items-center justify-center group-hover:bg-surface-variant active:scale-95 transition-all">
<span class="material-symbols-outlined text-on-surface text-[24px]">devices</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Apple</span>
</button>
<!-- Alipay -->
<button aria-label="支付宝快捷授权" class="flex flex-col items-center gap-1 group" type="button">
<div class="w-12 h-12 rounded-full bg-surface-container-lowest shadow-sm flex items-center justify-center group-hover:bg-primary-fixed/40 active:scale-95 transition-all">
<span class="material-symbols-outlined text-primary text-[24px]">account_balance_wallet</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">支付宝</span>
</button>
</div>
</section>
<!-- 6. Bottom User Agreement & Guest Access -->
<footer class="mt-space-lg flex flex-col items-center text-center gap-space-sm relative z-10">
<label class="flex items-start gap-space-xs max-w-[340px] cursor-pointer text-left">
<input checked="" class="mt-0.5 w-4 h-4 rounded text-primary accent-primary cursor-pointer shrink-0" id="termsCheckbox" type="checkbox">
<span class="font-label-sm text-label-sm text-on-surface-variant leading-relaxed">
        已阅读并同意<a class="text-primary hover:underline" href="#">《用户服务协议》</a>、<a class="text-primary hover:underline" href="#">《隐私政策》</a>以及<a class="text-primary hover:underline" href="#">《个人信息保护指南》</a>
</span>
</label>
<button class="inline-flex items-center gap-1 py-1 px-3 rounded-full text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="font-label-md text-label-md">先逛逛，暂不登录</span>
<span class="material-symbols-outlined text-[16px]">chevron_right</span>
</button>
</footer>

<script>
  let activeTab = 'quick';
  let countdownTimer = null;

  function switchTab(mode) {
    activeTab = mode;
    const tabQuick = document.getElementById('tabQuick');
    const tabPassword = document.getElementById('tabPassword');
    const codeLabel = document.getElementById('codeLabel');
    const codeInput = document.getElementById('codeInput');
    const trailingContainer = document.getElementById('dynamicInputTrailing');

    if (mode === 'quick') {
      tabQuick.className = 'flex-1 py-2 rounded-full font-label-md text-label-md text-on-primary bg-primary shadow-sm transition-all duration-200 flex items-center justify-center gap-1';
      tabPassword.className = 'flex-1 py-2 rounded-full font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-all duration-200 flex items-center justify-center gap-1';
      codeLabel.textContent = '短信验证码';
      codeInput.placeholder = '6位数字验证码';
      codeInput.type = 'text';
      codeInput.maxLength = 6;
      trailingContainer.innerHTML = `
        <button 
          type="button" 
          id="sendCodeBtn" 
          onclick="startCountdown()" 
          class="px-3 py-1.5 rounded-full bg-primary-container text-on-primary-container font-label-sm text-label-sm hover:opacity-90 active:scale-95 transition-all shadow-sm">
          获取验证码
        </button>
      `;
    } else {
      tabPassword.className = 'flex-1 py-2 rounded-full font-label-md text-label-md text-on-primary bg-primary shadow-sm transition-all duration-200 flex items-center justify-center gap-1';
      tabQuick.className = 'flex-1 py-2 rounded-full font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-all duration-200 flex items-center justify-center gap-1';
      codeLabel.textContent = '登录密码';
      codeInput.placeholder = '请输入您的账户密码';
      codeInput.type = 'password';
      codeInput.maxLength = 32;
      trailingContainer.innerHTML = `
        <button type="button" onclick="togglePasswordVisibility()" class="p-1 rounded-full text-on-surface-variant hover:text-on-surface">
          <span id="pwdEyeIcon" class="material-symbols-outlined text-[20px]">visibility_off</span>
        </button>
      `;
    }
  }

  function togglePasswordVisibility() {
    const codeInput = document.getElementById('codeInput');
    const eyeIcon = document.getElementById('pwdEyeIcon');
    if (!codeInput) return;
    if (codeInput.type === 'password') {
      codeInput.type = 'text';
      if (eyeIcon) eyeIcon.textContent = 'visibility';
    } else {
      codeInput.type = 'password';
      if (eyeIcon) eyeIcon.textContent = 'visibility_off';
    }
  }

  function startCountdown() {
    const btn = document.getElementById('sendCodeBtn');
    if (!btn || btn.disabled) return;
    let seconds = 60;
    btn.disabled = true;
    btn.classList.add('opacity-60', 'cursor-not-allowed');
    btn.textContent = `${seconds}s后重试`;

    clearInterval(countdownTimer);
    countdownTimer = setInterval(() => {
      seconds--;
      if (seconds > 0) {
        btn.textContent = `${seconds}s后重试`;
      } else {
        clearInterval(countdownTimer);
        btn.disabled = false;
        btn.classList.remove('opacity-60', 'cursor-not-allowed');
        btn.textContent = '重新获取';
      }
    }, 1000);
  }

  function triggerLogin() {
    const checkbox = document.getElementById('termsCheckbox');
    if (!checkbox.checked) {
      alert('请先勾选并同意《用户服务协议》与《隐私政策》');
      return;
    }
    const phone = document.getElementById('phoneInput').value.trim();
    if (!phone) {
      alert('请输入手机号码');
      return;
    }
    // Subtle success animation feedback
    const btn = event.currentTarget;
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span><span>正在登录...</span>';
    setTimeout(() => {
      btn.innerHTML = '<span class="material-symbols-outlined text-[20px]">check</span><span>登录成功</span>';
    }, 900);
  }
</script></main>
