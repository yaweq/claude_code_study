<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>账单 · 每日记账</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <main class="main">

      <!-- 本月摘要 -->
      <section class="card" style="display:flex;justify-content:space-around;text-align:center;padding:18px 12px">
        <div><div style="font-size:12px;color:var(--text-sub)">本月支出</div><div class="exp" style="font-size:18px;font-weight:700;font-variant-numeric:tabular-nums">¥3,219.50</div></div>
        <div><div style="font-size:12px;color:var(--text-sub)">本月收入</div><div class="inc" style="font-size:18px;font-weight:700;font-variant-numeric:tabular-nums">¥7,500.00</div></div>
        <div><div style="font-size:12px;color:var(--text-sub)">结余</div><div style="font-size:18px;font-weight:700;font-variant-numeric:tabular-nums">+¥4,280.50</div></div>
      </section>

      <!-- 筛选栏 -->
      <div class="filter-bar">
        <div class="filter-chips" id="filterChips">
          <button class="filter-chip active" data-filter="type"><span class="material-symbols-outlined" style="font-size:16px">tune</span>全部类型</button>
          <button class="filter-chip" data-filter="cat"><span class="material-symbols-outlined" style="font-size:16px">category</span>全部分类</button>
          <button class="filter-chip" data-filter="account"><span class="material-symbols-outlined" style="font-size:16px">account_balance_wallet</span>账户资产</button>
          <button class="filter-chip" data-filter="date"><span class="material-symbols-outlined" style="font-size:16px">calendar_today</span>日期范围</button>
        </div>
      </div>

      <!-- 今天 -->
      <section>
        <div class="txn-group"><span class="day">今天<span class="date">09月28日</span></span><span class="sum exp">支出 ¥114.00</span></div>
        <div class="txn-list">
          <div class="txn-item">
            <span class="txn-icon" style="background:#8FE0C3">🍜</span>
            <span class="txn-main"><span class="txn-name">日式蛋包饭</span><span class="txn-meta">餐饮<span class="sep"></span>微信支付</span></span>
            <span class="txn-amount exp">-¥38.00</span>
            <span class="txn-actions"><button class="txn-action" title="修改"><span class="material-symbols-outlined" style="font-size:15px">edit</span></button><button class="txn-action" title="删除"><span class="material-symbols-outlined" style="font-size:15px">delete</span></button></span>
          </div>
          <div class="txn-item">
            <span class="txn-icon" style="background:#8FE0C3">☕</span>
            <span class="txn-main"><span class="txn-name">燕麦拿铁</span><span class="txn-meta">餐饮<span class="sep"></span>支付宝</span></span>
            <span class="txn-amount exp">-¥28.00</span>
            <span class="txn-actions"><button class="txn-action" title="修改"><span class="material-symbols-outlined" style="font-size:15px">edit</span></button><button class="txn-action" title="删除"><span class="material-symbols-outlined" style="font-size:15px">delete</span></button></span>
          </div>
          <div class="txn-item">
            <span class="txn-icon" style="background:#9FD3E8">🚇</span>
            <span class="txn-main"><span class="txn-name">地铁通勤乘车码</span><span class="txn-meta">交通<span class="sep"></span>微信支付</span></span>
            <span class="txn-amount exp">-¥6.00</span>
            <span class="txn-actions"><button class="txn-action" title="修改"><span class="material-symbols-outlined" style="font-size:15px">edit</span></button><button class="txn-action" title="删除"><span class="material-symbols-outlined" style="font-size:15px">delete</span></button></span>
          </div>
          <div class="txn-item">
            <span class="txn-icon" style="background:#FFB3C1">🛒</span>
            <span class="txn-main"><span class="txn-name">便利店小零食水果</span><span class="txn-meta">购物<span class="sep"></span>现金</span></span>
            <span class="txn-amount exp">-¥42.00</span>
            <span class="txn-actions"><button class="txn-action" title="修改"><span class="material-symbols-outlined" style="font-size:15px">edit</span></button><button class="txn-action" title="删除"><span class="material-symbols-outlined" style="font-size:15px">delete</span></button></span>
          </div>
        </div>
      </section>

      <!-- 昨天 -->
      <section>
        <div class="txn-group"><span class="day">昨天<span class="date">09月27日</span></span><span class="sum" style="color:var(--text-sub)">支 ¥265.00 / 收 ¥800.00</span></div>
        <div class="txn-list">
          <div class="txn-item">
            <span class="txn-icon" style="background:#E6F7EF">🎁</span>
            <span class="txn-main"><span class="txn-name">季度项目微奖励</span><span class="txn-meta">奖金<span class="sep"></span>银行卡</span></span>
            <span class="txn-amount inc">+¥800.00</span>
            <span class="txn-actions"><button class="txn-action" title="修改"><span class="material-symbols-outlined" style="font-size:15px">edit</span></button><button class="txn-action" title="删除"><span class="material-symbols-outlined" style="font-size:15px">delete</span></button></span>
          </div>
          <div class="txn-item">
            <span class="txn-icon" style="background:#FFD98E">🏠</span>
            <span class="txn-main"><span class="txn-name">水电燃气均摊</span><span class="txn-meta">住房<span class="sep"></span>微信支付</span></span>
            <span class="txn-amount exp">-¥265.00</span>
            <span class="txn-actions"><button class="txn-action" title="修改"><span class="material-symbols-outlined" style="font-size:15px">edit</span></button><button class="txn-action" title="删除"><span class="material-symbols-outlined" style="font-size:15px">delete</span></button></span>
          </div>
        </div>
      </section>

      <!-- 左滑提示 -->
      <div style="text-align:center;font-size:11px;color:var(--text-muted)">左滑账单可快速补写「心情小记」或删除</div>
    </main>
  </div>

  <script src="js/app.js"></script>
  <script>
    AppShell.init('bills');
    // 筛选 chips 交互（原型演示）
    document.querySelectorAll('.filter-chip').forEach(function (chip) {
      chip.addEventListener('click', function () {
        document.querySelectorAll('.filter-chip').forEach(function (c) { c.classList.remove('active'); });
        chip.classList.add('active');
        toast('筛选：' + chip.textContent.trim());
      });
    });
    // 修改/删除
    document.querySelectorAll('.txn-action').forEach(function (btn) {
      btn.addEventListener('click', function () {
        toast(btn.title === '修改' ? '进入编辑' : '已删除（演示）');
      });
    });
  </script>
</body>
</html>
