<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>账单 · 每日记账</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <style>
    /* 筛选下拉面板 */
    .filter-panel {
      background: #fff;
      border-radius: 14px;
      padding: 8px;
      margin-bottom: 14px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      display: none;
    }
    .fp-opt {
      display: block;
      width: 100%;
      text-align: left;
      border: none;
      background: transparent;
      padding: 11px 12px;
      font-size: 14px;
      color: var(--text);
      border-radius: 10px;
      cursor: pointer;
    }
    .fp-opt:active { background: var(--primary-faint); }
    .fp-opt.active { background: var(--primary-faint); color: var(--primary-dark); font-weight: 600; }
    .filter-chip.active { border-color: var(--primary); color: var(--primary-dark); }
  </style>
</head>
<body>
  <div class="app">
    <main class="main">

      <!-- 本月摘要（数值由后端 /api/summary 填充） -->
      <section class="card" style="display:flex;justify-content:space-around;text-align:center;padding:18px 12px">
        <div><div style="font-size:12px;color:var(--text-sub)">本月支出</div><div class="exp" id="sumExpense" style="font-size:18px;font-weight:700;font-variant-numeric:tabular-nums">¥0.00</div></div>
        <div><div style="font-size:12px;color:var(--text-sub)">本月收入</div><div class="inc" id="sumIncome" style="font-size:18px;font-weight:700;font-variant-numeric:tabular-nums">¥0.00</div></div>
        <div><div style="font-size:12px;color:var(--text-sub)">结余</div><div id="sumBalance" style="font-size:18px;font-weight:700;font-variant-numeric:tabular-nums">+¥0.00</div></div>
      </section>

      <!-- 筛选栏 -->
      <div class="filter-bar">
        <div class="filter-chips" id="filterChips">
          <button class="filter-chip" data-filter="type"><span class="material-symbols-outlined" style="font-size:16px">tune</span><span class="chip-text">全部类型</span></button>
          <button class="filter-chip" data-filter="cat"><span class="material-symbols-outlined" style="font-size:16px">category</span><span class="chip-text">全部分类</span></button>
          <button class="filter-chip" data-filter="account"><span class="material-symbols-outlined" style="font-size:16px">account_balance_wallet</span><span class="chip-text">账户资产</span></button>
          <button class="filter-chip" data-filter="date"><span class="material-symbols-outlined" style="font-size:16px">calendar_today</span><span class="chip-text">日期范围</span></button>
        </div>
      </div>

      <!-- 清除筛选（有筛选时显示） -->
      <div id="clearBar" style="display:none;margin-bottom:10px;text-align:right">
        <button id="clearFilters" style="border:1px solid var(--primary);color:var(--primary-dark);background:var(--primary-faint);border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer">✕ 清除筛选</button>
      </div>

      <!-- 筛选下拉面板 -->
      <div class="filter-panel" id="filterPanel"></div>

      <!-- 账目列表容器 -->
      <div id="txnList"></div>

      <!-- 左滑提示 -->
      <div style="text-align:center;font-size:11px;color:var(--text-muted)">左滑账单可快速补写「心情小记」或删除</div>
    </main>
  </div>

  <script src="js/app.js"></script>
  <script>
    AppShell.init('bills');

    /* =========================================================
     * 工具函数
     * ========================================================= */
    var PALETTE = ['#FFB3C1', '#FFD98E', '#8FE0C3', '#C9B4E8', '#9FD3E8', '#FFA891'];

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function fmt(amount) {
      return '¥' + Math.abs(amount).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function pad(n) { return (n < 10 ? '0' : '') + n; }
    function dstr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
    function localToday() { return dstr(new Date()); }
    function localMonth() { return localToday().slice(0, 7); }
    function md(dateStr) {
      var p = dateStr.slice(5).split('-');
      return parseInt(p[0], 10) + '月' + parseInt(p[1], 10) + '日';
    }
    function dayLabel(dateStr) {
      if (dateStr === localToday()) return '今天';
      var y = new Date(); y.setDate(y.getDate() - 1);
      if (dateStr === dstr(y)) return '昨天';
      return md(dateStr);
    }

    /* =========================================================
     * 数据与筛选状态
     * ========================================================= */
    var allTxns = [];
    var cats = [];
    var filters = { type: '', cat: '', account: '', date: 'all' };

    function weekStartStr() {
      var now = new Date();
      var day = (now.getDay() + 6) % 7; // 周一为一周起点
      return dstr(new Date(now.getFullYear(), now.getMonth(), now.getDate() - day));
    }
    function lastMonthStr() {
      var d = new Date(); d.setDate(0); // 上月最后一天
      return d.getFullYear() + '-' + pad(d.getMonth() + 1);
    }
    function inDateRange(dateStr) {
      switch (filters.date) {
        case 'today': return dateStr === localToday();
        case 'week': return dateStr >= weekStartStr();
        case 'month': return dateStr.slice(0, 7) === localMonth();
        case 'lastMonth': return dateStr.slice(0, 7) === lastMonthStr();
        default: return true; // all
      }
    }
    function filteredTxns() {
      return allTxns.filter(function (t) {
        if (filters.type && t.type !== filters.type) return false;
        if (filters.cat && String(t.category_id) !== String(filters.cat)) return false;
        if (filters.account && t.account !== filters.account) return false;
        if (!inDateRange(t.date)) return false;
        return true;
      });
    }

    /* =========================================================
     * 筛选下拉面板
     * ========================================================= */
    function getOptions(key) {
      if (key === 'type') {
        return [
          { v: '', label: '全部类型' },
          { v: 'expense', label: '支出' },
          { v: 'income', label: '收入' }
        ];
      }
      if (key === 'cat') {
        return [{ v: '', label: '全部分类' }].concat(cats.map(function (c) {
          return { v: String(c.id), label: c.icon + ' ' + c.name };
        }));
      }
      if (key === 'account') {
        return [
          { v: '', label: '全部账户' },
          { v: '现金', label: '现金' },
          { v: '微信', label: '微信' },
          { v: '支付宝', label: '支付宝' },
          { v: '银行卡', label: '银行卡' }
        ];
      }
      if (key === 'date') {
        return [
          { v: 'all', label: '全部时间' },
          { v: 'today', label: '今天' },
          { v: 'week', label: '本周' },
          { v: 'month', label: '本月' },
          { v: 'lastMonth', label: '上月' }
        ];
      }
      return [];
    }
    function openPanel(key) {
      var panel = document.getElementById('filterPanel');
      var options = getOptions(key);
      var html = '';
      options.forEach(function (o) {
        var sel = String(filters[key]) === String(o.v);
        html += '<button class="fp-opt' + (sel ? ' active' : '') + '" data-v="' + esc(String(o.v)) + '">' + esc(o.label) + '</button>';
      });
      panel.innerHTML = html;
      panel.style.display = 'block';
      panel.querySelectorAll('.fp-opt').forEach(function (btn) {
        btn.addEventListener('click', function () { applyFilter(key, btn.getAttribute('data-v')); });
      });
    }
    function closePanel() {
      document.getElementById('filterPanel').style.display = 'none';
      document.getElementById('filterPanel').innerHTML = '';
    }
    function applyFilter(key, value) {
      filters[key] = value;
      updateChipText(key);
      closePanel();
      updateClearBar();
      renderTxns(filteredTxns());
    }
    function updateChipText(key) {
      var chip = document.querySelector('.filter-chip[data-filter="' + key + '"] .chip-text');
      var v = filters[key];
      var label;
      if (key === 'type') label = v === 'expense' ? '支出' : v === 'income' ? '收入' : '全部类型';
      else if (key === 'cat') { var c = cats.find(function (x) { return String(x.id) === String(v); }); label = c ? c.name : '全部分类'; }
      else if (key === 'account') label = v || '账户资产';
      else label = { all: '日期范围', today: '今天', week: '本周', month: '本月', lastMonth: '上月' }[v] || '日期范围';
      chip.textContent = label;
      chip.parentElement.classList.toggle('active', !!(v && v !== 'all'));
    }

    /* 清除筛选 */
    function hasActiveFilters() {
      return !!(filters.type || filters.cat || filters.account || filters.date !== 'all');
    }
    function updateClearBar() {
      document.getElementById('clearBar').style.display = hasActiveFilters() ? 'block' : 'none';
    }
    function clearFilters() {
      filters = { type: '', cat: '', account: '', date: 'all' };
      ['type', 'cat', 'account', 'date'].forEach(updateChipText);
      closePanel();
      openKey = null;
      document.querySelectorAll('.filter-chip').forEach(function (c) { c.classList.remove('active'); });
      updateClearBar();
      renderTxns(filteredTxns());
    }
    document.getElementById('clearFilters').addEventListener('click', clearFilters);

    /* chips 点击：打开/切换面板 */
    var openKey = null;
    document.querySelectorAll('.filter-chip').forEach(function (chip) {
      chip.addEventListener('click', function (e) {
        var key = chip.getAttribute('data-filter');
        if (openKey === key) { closePanel(); openKey = null; return; }
        openKey = key;
        document.querySelectorAll('.filter-chip').forEach(function (c) { c.classList.remove('active'); });
        chip.classList.add('active');
        openPanel(key);
      });
    });
    // 点击面板外关闭
    document.addEventListener('click', function (e) {
      if (!e.target.closest('.filter-chip') && !e.target.closest('.filter-panel')) { closePanel(); openKey = null; }
    });

    /* =========================================================
     * 渲染
     * ========================================================= */
    function renderTxns(rows) {
      var container = document.getElementById('txnList');
      if (!rows.length) {
        container.innerHTML = '<div style="text-align:center;padding:40px 0;color:var(--text-muted)">没有符合条件的记录</div>';
        return;
      }
      var groups = {};
      rows.forEach(function (t) { (groups[t.date] = groups[t.date] || []).push(t); });
      var html = '';
      Object.keys(groups).sort().reverse().forEach(function (date) {
        var items = groups[date];
        var exp = 0, inc = 0;
        items.forEach(function (t) { if (t.type === 'expense') exp += t.amount; else inc += t.amount; });
        var sumText = '';
        if (exp && inc) sumText = '支 ' + fmt(exp) + ' / 收 ' + fmt(inc);
        else if (exp) sumText = '支出 ' + fmt(exp);
        else sumText = '收入 ' + fmt(inc);
        html += '<section><div class="txn-group"><span class="day">' + dayLabel(date) +
          '<span class="date">' + md(date) + '</span></span><span class="sum ' + (exp ? 'exp' : 'inc') + '">' + sumText + '</span></div><div class="txn-list">';
        items.forEach(function (t) {
          var bg = PALETTE[(t.category_id - 1) % PALETTE.length];
          var name = t.note || t.category_name;
          var cls = t.type === 'expense' ? 'exp' : 'inc';
          var sign = t.type === 'expense' ? '-' : '+';
          html += '<div class="txn-item">' +
            '<span class="txn-icon" style="background:' + bg + '">' + esc(t.category_icon || '📦') + '</span>' +
            '<span class="txn-main"><span class="txn-name">' + esc(name) + '</span>' +
            '<span class="txn-meta">' + esc(t.category_name) + '<span class="sep"></span>' + esc(t.account) + '</span></span>' +
            '<span class="txn-amount ' + cls + '">' + sign + fmt(t.amount) + '</span>' +
            '</div>';
        });
        html += '</div></section>';
      });
      container.innerHTML = html;
    }

    function loadData() {
      var month = localMonth();
      return Promise.all([
        fetch('/api/summary?month=' + month).then(function (r) { return r.json(); }),
        fetch('/api/categories').then(function (r) { return r.json(); }),
        fetch('/api/transactions').then(function (r) { return r.json(); })
      ]).then(function (res) {
        var summary = res[0], catList = res[1], txs = res[2];
        if (summary.error) throw new Error(summary.error);
        cats = catList;
        allTxns = txs;
        document.getElementById('sumExpense').textContent = fmt(summary.expense);
        document.getElementById('sumIncome').textContent = fmt(summary.income);
        document.getElementById('sumBalance').textContent = (summary.balance >= 0 ? '+' : '') + fmt(summary.balance);
        renderTxns(allTxns);
      }).catch(function () {
        toast('未连接到后端，请确认后端已启动');
      });
    }

    loadData();
  </script>
</body>
</html>
