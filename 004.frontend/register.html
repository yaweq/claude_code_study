<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>注册 · 每日记账</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="auth">
    <div class="auth-hero">
      <div class="auth-logo">💰</div>
      <h1 class="auth-title">新用户加入</h1>
      <p class="auth-sub">已有账号？<a class="link" href="login.html">去登录</a></p>
    </div>

    <form class="auth-form" onsubmit="event.preventDefault();register()">
      <div class="auth-input">
        <span class="icon material-symbols-outlined">phone_iphone</span>
        <input type="tel" placeholder="手机号码" inputmode="tel" maxlength="11">
      </div>
      <div class="auth-input">
        <span class="icon material-symbols-outlined">sms</span>
        <input type="text" placeholder="短信验证码" inputmode="numeric" maxlength="6">
        <button type="button" class="code-btn" onclick="toast('验证码已发送（演示）')">获取验证码</button>
      </div>
      <div class="auth-input">
        <span class="icon material-symbols-outlined">lock</span>
        <input type="password" placeholder="设置登录密码（8-20位字符，含字母和数字）" maxlength="20">
      </div>
      <div style="font-size:12px;color:var(--text-sub)">安全强度: <span style="color:var(--income);font-weight:600">等待输入</span></div>
      <button type="submit" class="btn primary block">立即注册并登录</button>
    </form>

    <div style="margin-top:24px">
      <div style="font-size:14px;font-weight:700;margin-bottom:12px">新用户专属注册礼遇 🎁</div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <div class="perk"><span class="perk-icon" style="background:#FFE8EE">🎨</span><span class="perk-text"><b>专属马卡龙</b><span>免费限定主题</span></span></div>
        <div class="perk"><span class="perk-icon" style="background:#FFF4E0">🔔</span><span class="perk-text"><b>超支柔和提醒</b><span>温柔预算呵护</span></span></div>
        <div class="perk"><span class="perk-icon" style="background:#E6F7EF">☁️</span><span class="perk-text"><b>双端实时云备</b><span>财务足迹不丢</span></span></div>
      </div>
    </div>

    <p class="auth-footer">
      注册即代表同意<a href="#" onclick="return false">《用户服务协议》</a>和<a href="#" onclick="return false">《隐私保护政策》</a>
    </p>
    <p style="text-align:center;font-size:12px;color:var(--text-muted)">每日记账 · 陪你记录生活中的每一点确幸</p>
  </div>

  <script src="js/app.js"></script>
  <script>
    function register() {
      toast('注册成功');
      setTimeout(function () { location.href = 'index.html'; }, 900);
    }
  </script>
</body>
</html>
