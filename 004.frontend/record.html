<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>记一笔 · 每日记账</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <main class="main record-layout">

      <!-- 支出 / 收入切换 -->
      <div style="display:flex;justify-content:center;margin-bottom:16px">
        <div class="seg" id="typeSeg">
          <button class="seg-btn active" data-type="expense">支出</button>
          <button class="seg-btn" data-type="income">收入</button>
        </div>
      </div>

      <!-- 金额输入 -->
      <div class="record-amount">
        <span class="record-currency">¥</span>
        <input type="text" inputmode="decimal" class="record-input" id="amountInput" placeholder="0.00" autofocus>
      </div>
      <div class="record-quick">
        <button class="record-chip" data-v="10">10</button>
        <button class="record-chip" data-v="20">20</button>
        <button class="record-chip" data-v="50">50</button>
        <button class="record-chip" data-v="100">100</button>
      </div>

      <!-- 分类宫格（从后端 /api/categories 加载） -->
      <div class="cat-grid" id="catGrid"></div>

      <!-- 备注 -->
      <div class="record-fields">
        <div class="field"><label>日期</label><input type="date" id="dateInput"></div>
        <div class="field"><label>账户</label>
          <select id="accountSelect">
            <option>现金</option>
            <option>微信</option>
            <option>支付宝</option>
            <option>银行卡</option>
          </select>
        </div>
        <div class="field"><label>备注</label><input type="text" id="noteInput" placeholder="写点什么…" maxlength="100"></div>
      </div>

      <button class="btn primary block" id="saveBtn" style="margin-top:4px">
        <span class="material-symbols-outlined" style="font-size:20px">check_circle</span>完成
      </button>
    </main>
  </div>

  <script src="js/app.js"></script>
  <script>
    AppShell.initRecord();
    document.getElementById('dateInput').valueAsDate = new Date();

    var PALETTE = ['#FFB3C1', '#FFD98E', '#8FE0C3', '#C9B4E8', '#9FD3E8', '#FFA891'];
    var categories = { expense: [], income: [] };
    var currentType = 'expense';
    var selectedCatId = null;
    var preset = new URLSearchParams(location.search).get('cat'); // record.html?cat=餐饮

    function localToday() {
      var d = new Date();
      return d.getFullYear() + '-' + (d.getMonth() + 1 < 10 ? '0' + (d.getMonth() + 1) : d.getMonth() + 1) + '-' + (d.getDate() < 10 ? '0' + d.getDate() : d.getDate());
    }

    function renderGrid() {
      var grid = document.getElementById('catGrid');
      grid.innerHTML = '';
      categories[currentType].forEach(function (c, i) {
        if (preset && c.name === preset) selectedCatId = c.id;
        var cell = document.createElement('button');
        cell.className = 'cat-cell' + (c.id === selectedCatId ? ' active' : '');
        var bg = PALETTE[i % PALETTE.length];
        cell.innerHTML = '<span class="cat-cell-icon" style="background:' + bg + '">' + c.icon + '</span>' +
          '<span class="cat-cell-name">' + c.name + '</span>';
        cell.addEventListener('click', function () {
          selectedCatId = c.id;
          preset = null;
          grid.querySelectorAll('.cat-cell').forEach(function (x) { x.classList.remove('active'); });
          cell.classList.add('active');
        });
        grid.appendChild(cell);
      });
    }

    // 从后端加载分类
    fetch('/api/categories')
      .then(function (r) { return r.json(); })
      .then(function (list) {
        list.forEach(function (c) { categories[c.type].push(c); });
        renderGrid();
      })
      .catch(function () { toast('未连接到后端'); });

    // 类型切换
    document.querySelectorAll('#typeSeg .seg-btn').forEach(function (b) {
      b.addEventListener('click', function () {
        currentType = b.getAttribute('data-type');
        selectedCatId = null; preset = null;
        document.querySelectorAll('#typeSeg .seg-btn').forEach(function (x) { x.classList.remove('active'); });
        b.classList.add('active');
        renderGrid();
      });
    });

    // 快捷金额
    document.querySelectorAll('.record-chip').forEach(function (chip) {
      chip.addEventListener('click', function () {
        document.getElementById('amountInput').value = chip.getAttribute('data-v');
        document.getElementById('amountInput').focus();
      });
    });

    // 保存（POST 写库）
    document.getElementById('saveBtn').addEventListener('click', function () {
      var amtStr = document.getElementById('amountInput').value;
      var yuan = parseFloat(amtStr);
      if (!amtStr || isNaN(yuan) || yuan <= 0) { toast('请输入有效金额'); return; }
      if (!selectedCatId) { toast('请选择分类'); return; }

      var body = {
        type: currentType,
        amount: Math.round(yuan * 100) / 100,
        category_id: selectedCatId,
        account: document.getElementById('accountSelect').value,
        note: document.getElementById('noteInput').value.trim() || null,
        date: document.getElementById('dateInput').value || localToday()
      };
      fetch('/api/transactions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res.error) { toast('保存失败：' + res.error); return; }
          toast('已记录 ¥' + yuan.toFixed(2));
          setTimeout(function () { location.href = 'bills.html'; }, 800);
        })
        .catch(function () { toast('保存失败（未连接到后端）'); });
    });
  </script>
</body>
</html>
