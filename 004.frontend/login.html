<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>登录 · 每日记账</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="auth">
    <div class="auth-hero">
      <div class="auth-logo">💰</div>
      <h1 class="auth-title">每日记账</h1>
      <p class="auth-sub">让每一笔收支都温暖明晰</p>
    </div>

    <form class="auth-form" onsubmit="event.preventDefault();login()">
      <div class="auth-input">
        <span class="icon material-symbols-outlined">phone_iphone</span>
        <input type="tel" placeholder="手机号码 / 账户" inputmode="tel" maxlength="11">
      </div>
      <div class="auth-input">
        <span class="icon material-symbols-outlined">sms</span>
        <input type="text" placeholder="短信验证码" inputmode="numeric" maxlength="6">
        <button type="button" class="code-btn" onclick="toast('验证码已发送（演示）')">获取验证码</button>
      </div>
      <div style="text-align:right"><a class="link" href="#" onclick="toast('找回账号（演示）');return false" style="font-size:12px">遇到问题？找回账号</a></div>
      <button type="submit" class="btn primary block">一键登录 / 注册</button>
    </form>

    <button class="btn ghost block" style="margin-top:12px" onclick="login()">
      <span class="material-symbols-outlined" style="font-size:20px">face</span>支持 Face ID 极速免密登录
    </button>

    <div class="auth-tip" style="margin-top:14px">还没有账号？<a class="link" href="register.html">立即注册</a></div>

    <div class="auth-divider">或通过以下方式快速登录</div>
    <div class="auth-social">
      <button class="auth-social-btn" onclick="login()"><span style="color:#07C160">💬</span>微信</button>
      <button class="auth-social-btn" onclick="login()"><span style="color:#1677FF">💙</span>支付宝</button>
    </div>

    <p class="auth-footer">
      登录即代表同意<a href="#" onclick="return false">《用户服务协议》</a>、<a href="#" onclick="return false">《隐私政策》</a><br>以及<a href="#" onclick="return false">《个人信息保护指南》</a>
    </p>
    <p style="text-align:center"><a class="link" href="index.html" style="font-size:13px">先逛逛，暂不登录</a></p>
  </div>

  <script src="js/app.js"></script>
  <script>
    function login() {
      toast('登录成功');
      setTimeout(function () { location.href = 'index.html'; }, 900);
    }
  </script>
</body>
</html>
